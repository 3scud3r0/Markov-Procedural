[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markovjunior-procedural"
version = "1.0.0"
description = "Markov procedural language and Studio: Python-compatible programming, geometry, animation, data and code generation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
validation = ["numpy>=1.26,<3"]
preview = ["CairoSVG>=2.7,<3"]

[project.scripts]
markovjunior = "markovjunior.cli:main"

[tool.setuptools]
py-modules = ["procedural"]

[tool.setuptools.packages.find]
include = ["markovjunior", "markovjunior.procedural"]

[tool.setuptools.package-data]
markovjunior = ["assets/**/*", "assets/*"]
